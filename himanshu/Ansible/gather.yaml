- name: gathering facts playbook
  hosts: all
  gather_facts: true

  tasks:
    - name: print os name
      debug:
        msg: "{{ ansible_distribution }}"
      tags: 
       -task1
    
    - name: collect ip address
      debug:
        msg: "{{ ansible_default_ipv4 }}"
      tags:
       -task2
    - name: print working directory
      debug:
        msg: "{{ ansible_env.PWD }}"
      tags:
       -task3

